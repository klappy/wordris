<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Layout Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: Arial, sans-serif;
        }
        .mobile-word-list {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .word-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .verse-ref {
            font-size: 0.7rem;
            color: #ffd700;
            font-weight: bold;
        }
        .word-count {
            font-size: 0.7rem;
            color: #4CAF50;
            font-weight: bold;
        }
        .word-list-items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            max-height: 60px;
            overflow-y: auto;
        }
        .word-item {
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .word-item.pending {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }
        .word-item.found {
            background: linear-gradient(45deg, #4CAF50, #8BC34A);
            color: white;
            border-color: #4CAF50;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        .test-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <h1>📱 Mobile Layout Test</h1>
        <p>Screen width: <span id="width"></span>px</p>
        <p>If you see this, the new mobile layout is working!</p>
    </div>

    <div class="mobile-word-list">
        <div class="word-list-header">
            <span class="verse-ref">John 3:16</span>
            <span class="word-count">3/8</span>
        </div>
        <div style="color: lime; font-size: 0.6rem; text-align: center; margin-bottom: 0.3rem;">
            📱 MOBILE LAYOUT ACTIVE
        </div>
        <div class="word-list-items">
            <span class="word-item found">God</span>
            <span class="word-item found">loved</span>
            <span class="word-item found">world</span>
            <span class="word-item pending">gave</span>
            <span class="word-item pending">only</span>
            <span class="word-item pending">Son</span>
            <span class="word-item pending">whoever</span>
            <span class="word-item pending">believes</span>
        </div>
    </div>

    <script>
        document.getElementById('width').textContent = window.innerWidth;
        window.addEventListener('resize', () => {
            document.getElementById('width').textContent = window.innerWidth;
        });
    </script>
</body>
</html>
